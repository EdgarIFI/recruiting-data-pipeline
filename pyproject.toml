[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recruiting-pipeline"
version = "0.1.0"
description = "Synthetic recruiting-data pipeline: ingestion, validation and hiring-funnel KPIs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Edgar Axel Pérez Flores" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pandera>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
recruiting-pipeline = "recruiting_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
